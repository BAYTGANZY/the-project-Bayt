
name: Test build

on:
  push:
    branches:
      - feature/genomgang-av-fastighet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installera paket
        run: npm ci

      - name: Kontrollera bygget
        run: npm run build
